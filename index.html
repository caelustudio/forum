<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Caelus 论坛</title>
<meta name="description" content="Caelus 论坛 —— 用 Star ID 登录即可发帖、评论和点赞，聊聊设计、作品与灵感。">
<link rel="icon" href="/assets/favicon.png" type="image/png">
<link rel="canonical" href="https://forum.caelus.top/">
<link rel="stylesheet" href="https://www.caelus.top/fonts/opposans40/result.css">
<link rel="stylesheet" href="/assets/forum.css?v=20261004d">
<script>(function(){try{var t=localStorage.getItem('theme')||(window.matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light');document.documentElement.setAttribute('data-theme',t);}catch(e){}})();</script>
</head>
<body>
<div class="wrap">
  <div class="main">
    <div class="toolbar">
      <div class="seg" id="seg">
        <button data-sort="new">最新</button>
        <button data-sort="hot">热门</button>
      </div>
      <span class="grow"></span>
      <span class="count-note" id="countNote"></span>
      <a class="btn btn-ghost" href="/new.html">写帖子</a>
    </div>
    <div class="cat-chips" id="cats"></div>
    <div class="chips" id="chips"></div>
    <div class="post-list" id="list">
      <div class="skel"></div><div class="skel"></div><div class="skel"></div>
    </div>
    <div id="pager" style="margin-top:20px"></div>
  </div>

  <aside class="side">
    <div class="card" id="ctaCard">
      <div class="card-title">开始发帖</div>
      <p style="font-size:.8rem;line-height:1.75;color:var(--text-muted);margin:0 0 14px">
        用 Star ID 登录后就能发帖、评论和点赞。支持 Star ID 邮箱密码，也支持 OK 账号一键登录。
      </p>
      <a class="btn btn-primary" href="/new.html" style="width:100%">写一篇帖子</a>
    </div>
    <div class="card">
      <div class="card-title">话题<span id="tagCount" style="font-size:.72rem"></span></div>
      <div class="tag-list" id="sideTags"><span class="helper">加载中…</span></div>
    </div>
    <div class="card">
      <div class="card-title">关于</div>
      <p style="font-size:.78rem;line-height:1.8;color:var(--text-muted);margin:0">
        这里是 Caelus Studio 的公开论坛。<br>
        帖子与评论由发布者本人负责；违规内容会被管理员删除或编辑。
      </p>
      <p style="font-size:.78rem;line-height:1.8;color:var(--text-muted);margin:12px 0 0">
        <a href="https://www.caelus.top/" style="color:var(--accent)">返回主站</a> ·
        <a href="https://www.caelus.top/account/" style="color:var(--accent)">账号中心</a>
      </p>
    </div>
  </aside>
</div>

<footer class="foot">
  © 2026 Caelus Studio · <a href="https://www.caelus.top/">caelus.top</a>
</footer>

<script src="/assets/forum.js?v=20261004d"></script>
<script>
(function () {
  var sp = new URLSearchParams(location.search);
  var view = {
    sort: sp.get('sort') === 'hot' ? 'hot' : 'new',
    cat: sp.get('cat') || '',
    tag: sp.get('tag') || '',
    q: sp.get('q') || '',
    page: Math.max(1, parseInt(sp.get('page') || '1', 10) || 1)
  };
  var listEl = Forum.q('#list');
  var meta = { total: 0, size: 20 };

  function url(o) {
    var p = new URLSearchParams();
    if (o.sort === 'hot') p.set('sort', 'hot');
    if (o.cat) p.set('cat', o.cat);
    if (o.tag) p.set('tag', o.tag);
    if (o.q) p.set('q', o.q);
    if (o.page > 1) p.set('page', o.page);
    var s = p.toString();
    return '/' + (s ? '?' + s : '');
  }

  function renderSeg() {
    [].forEach.call(document.querySelectorAll('#seg button'), function (b) {
      b.className = b.getAttribute('data-sort') === view.sort ? 'on' : '';
      b.onclick = function () { view.page = 1; go(); };
    });
  }

  function renderCats(cats) {
    var box = Forum.q('#cats');
    if (!box) return;
    var total = (cats || []).reduce(function (n, c) { return n + c.count; }, 0);
    var html = '<button class="cat-chip' + (view.cat ? '' : ' on') + '" data-cat="">全部 <em>' + total + '</em></button>';
    (cats || []).forEach(function (c) {
      html += '<button class="cat-chip' + (view.cat === c.name ? ' on' : '') + '" data-cat="' + Forum.esc(c.name) + '">' +
        Forum.esc(c.name) + ' <em>' + c.count + '</em></button>';
    });
    box.innerHTML = html;
    [].forEach.call(box.querySelectorAll('.cat-chip'), function (b) {
      b.onclick = function () {
        var v = b.getAttribute('data-cat');
        view.cat = view.cat === v ? '' : v;
        view.page = 1; go();
      };
    });
  }

  function renderChips(tags) {
    var html = '<button class="chip' + (view.tag ? '' : ' on') + '" data-tag="">全部</button>';
    tags.slice(0, 14).forEach(function (t) {
      html += '<button class="chip' + (view.tag === t.name ? ' on' : '') + '" data-tag="' + Forum.esc(t.name) + '">#' + Forum.esc(t.name) + ' <em style="font-style:normal;opacity:.55">' + t.count + '</em></button>';
    });
    var box = Forum.q('#chips');
    box.innerHTML = html;
    [].forEach.call(box.querySelectorAll('.chip'), function (c) {
      c.onclick = function () { view.tag = c.getAttribute('data-tag'); view.page = 1; go(); };
    });
    var side = Forum.q('#sideTags');
    if (!tags.length) { side.innerHTML = '<span class="helper">还没有话题</span>'; }
    else {
      side.innerHTML = tags.slice(0, 18).map(function (t) {
        return '<span class="tag" data-tag="' + Forum.esc(t.name) + '">#' + Forum.esc(t.name) + '<em>' + t.count + '</em></span>';
      }).join('');
      [].forEach.call(side.querySelectorAll('.tag'), function (el) {
        el.onclick = function () { view.tag = el.getAttribute('data-tag'); view.page = 1; go(); };
      });
    }
    var tc = Forum.q('#tagCount');
    if (tc) tc.textContent = tags.length ? tags.length + ' 个' : '';
  }

  function card(p) {
    var kw = view.q;
    var m = p.matchIn || [];
    var from = [];
    if (kw) {
      if (m.indexOf('comment') >= 0) from.push('评论');
      if (m.indexOf('tag') >= 0) from.push('标签');
    }
    var onlyFrom = from.length && m.indexOf('title') < 0 && m.indexOf('body') < 0;
    return '<a class="post-card" href="/post.html?id=' + encodeURIComponent(p.id) + '">' +
      '<div class="pc-head">' +
        '<div class="who">' + Forum.avatarHtml(p) + '<b>' + Forum.hl(p.author, kw) + '</b>' +
          (p.starId ? '<span class="sid">' + Forum.hl(p.starId, kw) + '</span>' : '') + '</div>' +
        '<span class="pc-time">' + Forum.timeAgo(p.createdAt) + '</span>' +
      '</div>' +
      '<h3 class="pc-title">' + (p.category ? '<span class="cat-badge">' + Forum.esc(p.category) + '</span>' : '') +
        Forum.hl(p.title, kw) + '</h3>' +
      (p.excerpt ? '<p class="pc-excerpt">' + Forum.hl(p.excerpt, kw) + '</p>' : '') +
      (onlyFrom ? '<div class="match-note">命中' + from.join(' / ') +
        (p.matchText ? '：' + Forum.hl(p.matchText, kw) : '') + '</div>' : '') +
      '<div class="pc-foot">' +
        '<div class="tags">' + Forum.tagsHtml(p.tags) + '</div>' +
        '<div class="pc-stats">' +
          '<i class="' + (p.liked ? 'liked' : '') + '"><svg viewBox="0 0 24 24"><path d="M12 21s-7.5-4.6-9.3-8.5C1.2 9.2 3 5.9 6.3 5.3c2-.4 4 .5 5.7 2.6 1.7-2.1 3.7-3 5.7-2.6 3.3.6 5.1 3.9 3.6 7.2C19.5 16.4 12 21 12 21z"/></svg>' + p.likes + '</i>' +
          '<i>' + p.comments + ' 条评论</i>' +
          '<i>' + (p.views || 0) + ' 次阅读</i>' +
        '</div>' +
      '</div>' +
    '</a>';
  }

  function render(d) {
    meta.total = d.total; meta.size = d.size;
    renderSeg();
    renderCats(d.cats || []);
    renderChips(d.tags || []);
    var note = Forum.q('#countNote');
    var bits = [];
    if (view.q) bits.push('搜索「' + view.q + '」');
    if (view.cat) bits.push('分类：' + view.cat);
    if (view.tag) bits.push('#' + view.tag);
    bits.push('共 ' + d.total + ' 篇');
    note.textContent = bits.join(' · ');

    if (!d.posts.length) {
      listEl.innerHTML = '<div class="empty"><b>这里还没有帖子</b>' +
        (view.q || view.tag ? '换个关键词或话题看看，也可以直接发一篇。' : '来做第一个发帖的人吧。') + '</div>';
    } else {
      listEl.innerHTML = d.posts.map(card).join('');
    }

    var pages = Math.max(1, Math.ceil(d.total / d.size));
    var pager = Forum.q('#pager');
    if (pages <= 1) { pager.innerHTML = ''; return; }
    pager.innerHTML =
      '<div style="display:flex;align-items:center;gap:12px;justify-content:center">' +
        (view.page > 1 ? '<a class="btn btn-ghost" href="' + url({ sort: view.sort, cat: view.cat, tag: view.tag, q: view.q, page: view.page - 1 }) + '">上一页</a>' : '') +
        '<span class="count-note">第 ' + view.page + ' / ' + pages + ' 页</span>' +
        (view.page < pages ? '<a class="btn btn-ghost" href="' + url({ sort: view.sort, cat: view.cat, tag: view.tag, q: view.q, page: view.page + 1 }) + '">下一页</a>' : '') +
      '</div>';
  }

  function go() {
    history.replaceState(null, '', url(view));
    listEl.innerHTML = '<div class="skel"></div><div class="skel"></div><div class="skel"></div>';
    var p = new URLSearchParams();
    p.set('sort', view.sort);
    if (view.cat) p.set('cat', view.cat);
    if (view.tag) p.set('tag', view.tag);
    if (view.q) p.set('q', view.q);
    p.set('page', String(view.page));
    if (Forum.token()) p.set('token', Forum.token());
    Forum.api('/api/forum/list?' + p.toString()).then(function (d) {
      if (!d || !d.ok) { listEl.innerHTML = '<div class="empty"><b>加载失败</b>请刷新页面重试。</div>'; return; }
      render(d);
    }).catch(function () {
      listEl.innerHTML = '<div class="empty"><b>网络异常</b>请稍后刷新重试。</div>';
    });
  }

  Forum.init({
    active: view.sort === 'hot' && !view.tag && !view.q ? 'hot' : 'index',
    onReady: function () {
      document.title = (view.tag ? '#' + view.tag + ' · ' : '') + 'Caelus 论坛';
      go();
    },
    onLogin: function () { go(); }
  });
})();
</script>
</body>
</html>
