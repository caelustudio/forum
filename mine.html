<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>我的帖子 · Caelus 论坛</title>
<link rel="icon" href="/assets/favicon.png" type="image/png">
<link rel="stylesheet" href="https://www.caelus.top/fonts/opposans40/result.css">
<link rel="stylesheet" href="/assets/forum.css?v=20261004e">
<script>(function(){try{var t=localStorage.getItem('theme')||(window.matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light');document.documentElement.setAttribute('data-theme',t);}catch(e){}})();</script>
</head>
<body>
<div class="wrap">
  <div class="main">
    <div class="toolbar">
      <span class="count-note" id="note">我的帖子</span>
      <span class="grow"></span>
      <a class="btn btn-primary" href="/new.html">写帖子</a>
    </div>
    <div class="post-list" id="list"><div class="skel"></div><div class="skel"></div></div>
  </div>

  <aside class="side">
    <div class="card" id="meCard">
      <div class="card-title">账号</div>
      <div id="meBox" class="helper">加载中…</div>
    </div>
  </aside>
</div>

<footer class="foot">
  © 2026 Caelus Studio · <a href="https://www.caelus.top/">caelus.top</a>
</footer>

<script src="/assets/forum.js?v=20261004e"></script>
<script>
(function () {
  var listEl = Forum.q('#list');

  function card(p) {
    return '<a class="post-card" href="/post.html?id=' + encodeURIComponent(p.id) + '"' +
      (p.hidden ? ' style="opacity:.55"' : '') + '>' +
      '<div class="pc-head">' +
        '<div class="who">' + (p.category ? '<span class="cat-badge">' + Forum.esc(p.category) + '</span>' : '') +
          '<b>' + Forum.esc(p.title) + '</b>' + (p.hidden ? '<span class="tag plain">已删除</span>' : '') + '</div>' +
        '<span class="pc-time">' + Forum.timeAgo(p.createdAt) + '</span>' +
      '</div>' +
      (p.excerpt ? '<p class="pc-excerpt">' + Forum.esc(p.excerpt) + '</p>' : '') +
      '<div class="pc-foot">' +
        '<div class="tags">' + Forum.tagsHtml(p.tags) + '</div>' +
        '<div class="pc-stats">' +
          '<i><svg viewBox="0 0 24 24"><path d="M12 21s-7.5-4.6-9.3-8.5C1.2 9.2 3 5.9 6.3 5.3c2-.4 4 .5 5.7 2.6 1.7-2.1 3.7-3 5.7-2.6 3.3.6 5.1 3.9 3.6 7.2C19.5 16.4 12 21 12 21z"/></svg>' + p.likes + '</i>' +
          '<i>' + p.comments + ' 条评论</i>' +
          '<i>' + (p.views || 0) + ' 次阅读</i>' +
        '</div>' +
      '</div>' +
    '</a>';
  }

  function renderMe() {
    var u = Forum.me();
    var box = Forum.q('#meBox');
    if (!u) { box.innerHTML = '<button class="btn btn-primary" id="mLogin" style="width:100%">登录 / 注册</button>'; Forum.q('#mLogin').onclick = function () { Forum.openLogin(); }; return; }
    box.innerHTML =
      '<div class="who" style="margin-bottom:6px">' + Forum.avatarHtml(u, 'lg') + Forum.vBadge(u) +
        '<div><div style="font-size:.86rem">' + Forum.esc(u.nickname || 'Star ID 用户') + '</div>' +
        '<div style="font-size:.7rem;color:var(--text-muted);font-family:ui-monospace,Menlo,monospace">' + Forum.esc(u.starId || '') + '</div></div></div>' +
      '<a class="btn btn-ghost" href="https://www.caelus.top/account/" style="width:100%;margin-top:10px">账号中心</a>';
  }

  function load() {
    renderMe();
    if (!Forum.me()) {
      listEl.innerHTML = '<div class="empty"><b>登录后可以查看自己的帖子</b>' +
        '用 Star ID 或 OK 账号登录即可。<div style="margin-top:16px"><button class="btn btn-primary" id="lLogin">登录 / 注册</button></div></div>';
      Forum.q('#lLogin').onclick = function () { Forum.openLogin(); };
      return;
    }
    var p = new URLSearchParams({ token: Forum.token() });
    Forum.api('/api/forum/mine?' + p.toString()).then(function (d) {
      if (!d || !d.ok) { listEl.innerHTML = '<div class="empty"><b>加载失败</b>' + Forum.esc((d && d.error) || '') + '</div>'; return; }
      Forum.q('#note').textContent = '我的帖子 · 共 ' + d.total + ' 篇';
      if (!d.posts.length) {
        listEl.innerHTML = '<div class="empty"><b>还没有发过帖子</b>去论坛看看，或者直接写一篇。<div style="margin-top:16px"><a class="btn btn-primary" href="/new.html">写帖子</a></div></div>';
        return;
      }
      listEl.innerHTML = d.posts.map(card).join('');
    }).catch(function () { listEl.innerHTML = '<div class="empty"><b>网络异常</b>请稍后刷新重试。</div>'; });
  }

  Forum.init({
    active: 'mine',
    onReady: load,
    onLogin: load
  });
})();
</script>
</body>
</html>
