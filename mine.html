<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>个人主页 · Caelus 论坛</title>
<link rel="icon" href="/assets/favicon.png" type="image/png">
<link rel="stylesheet" href="https://www.caelus.top/fonts/opposans40/result.css">
<link rel="stylesheet" href="/assets/forum.css?v=20261005b">
<script>(function(){try{var t=localStorage.getItem('theme')||(window.matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light');document.documentElement.setAttribute('data-theme',t);}catch(e){}})();</script>
</head>
<body>
<div class="wrap single">
  <div class="main">
    <div id="banner" class="profile-banner"><div class="helper" style="color:rgba(255,255,255,.75)">加载中…</div></div>

    <div class="pf-tabs" id="tabs" style="display:none">
      <button data-tab="posts" class="on">我的帖子</button>
      <button data-tab="following">关注</button>
      <button data-tab="followers">粉丝</button>
    </div>

    <div class="post-list" id="list"><div class="skel"></div><div class="skel"></div></div>
    <div id="people" style="display:none"><div class="skel"></div></div>
  </div>
</div>

<footer class="foot">
  © 2026 Caelus Studio · <a href="https://www.caelus.top/">caelus.top</a> · <a href="/rules.html">论坛使用协议</a>
</footer>

<script src="/assets/forum.js?v=20261005b"></script>
<script>
(function () {
  var listEl = Forum.q('#list'), peopleEl = Forum.q('#people'),
      tabsEl = Forum.q('#tabs'), bannerEl = Forum.q('#banner'),
      curTab = 'posts';

  function card(p) {
    return '<a class="post-card" href="/post.html?id=' + encodeURIComponent(p.id) + '"' +
      (p.hidden ? ' style="opacity:.55"' : '') + '>' +
      '<div class="pc-head">' +
        '<div class="who">' + (p.category ? '<span class="cat-badge">' + Forum.esc(p.category) + '</span>' : '') +
          '<b>' + Forum.esc(p.title) + '</b>' + (p.hidden ? '<span class="tag plain">已删除</span>' : '') + '</div>' +
        '<span class="pc-time">' + Forum.timeAgo(p.createdAt) + '</span>' +
      '</div>' +
      (p.excerpt ? '<p class="pc-excerpt">' + Forum.esc(p.excerpt) + '</p>' : '') +
      '<div class="pc-foot">' +
        '<div class="tags">' + Forum.tagsHtml(p.tags) + '</div>' +
        '<div class="pc-stats">' +
          '<i><svg viewBox="0 0 24 24"><path d="M12 21s-7.5-4.6-9.3-8.5C1.2 9.2 3 5.9 6.3 5.3c2-.4 4 .5 5.7 2.6 1.7-2.1 3.7-3 5.7-2.6 3.3.6 5.1 3.9 3.6 7.2C19.5 16.4 12 21 12 21z"/></svg>' + p.likes + '</i>' +
          '<i>' + p.comments + ' 条评论</i>' +
          '<i>' + (p.views || 0) + ' 次阅读</i>' +
        '</div>' +
      '</div>' +
    '</a>';
  }

  /* ---------- banner 资料卡 ---------- */
  function fmtDate(ts) {
    if (!ts) return '';
    var d = new Date(ts);
    return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
  }
  function renderBanner() {
    var u = Forum.me();
    if (!u) {
      bannerEl.innerHTML =
        '<div class="pf-ava">?</div>' +
        '<div style="min-width:0"><div class="pf-name">未登录</div>' +
        '<div class="pf-days">登录后查看你的个人主页</div>' +
        '<div style="margin-top:10px"><button class="pf-btn" id="bLogin">登录 / 注册</button></div></div>';
      Forum.q('#bLogin').onclick = function () { Forum.openLogin(); };
      return;
    }
    var ava = u.avatar
      ? '<img class="pf-ava" src="' + Forum.esc(u.avatar) + '" alt="">'
      : '<span class="pf-ava">' + Forum.esc(String(u.nickname || u.starId || '?').trim().charAt(0) || '?') + '</span>';
    var days = '';
    if (u.createdAt) {
      var n = Math.max(1, Math.floor((Date.now() - u.createdAt) / 86400000));
      days = '<div class="pf-days">已加入 ' + n + ' 天（' + fmtDate(u.createdAt) + ' 注册）</div>';
    }
    bannerEl.innerHTML =
      ava +
      '<div style="min-width:0">' +
        '<div class="pf-name">' + Forum.esc(u.nickname || 'Star ID 用户') + Forum.vBadge(u) +
          (u.verified ? '<span class="pf-pill">' + Forum.V_SVG + 'Caelus Studio</span>' : '') +
        '</div>' +
        '<div class="pf-meta">' +
          (u.email ? '<span><i>✉</i>' + Forum.esc(u.email) + '</span>' : '') +
          '<span><i>ID</i><span style="font-family:ui-monospace,Menlo,monospace">' + Forum.esc(u.starId || '') + '</span></span>' +
        '</div>' + days +
      '</div>' +
      '<span class="grow"></span>' +
      '<a class="pf-btn" href="/new.html">写帖子</a>' +
      '<a class="pf-btn ghost" href="https://www.caelus.top/account/">账号中心</a>';
  }

  /* ---------- 关注 / 粉丝 ---------- */
  function userRow(x, canUnfollow) {
    var ava = x.avatar
      ? '<img class="av lg" src="' + Forum.esc(x.avatar) + '" alt="">'
      : '<span class="av lg">' + Forum.esc(String(x.nickname || '?').trim().charAt(0) || '?') + '</span>';
    return '<div class="pf-user">' + ava +
      '<div style="min-width:0">' +
        '<div style="font-size:.84rem;display:flex;align-items:center;gap:4px">' + Forum.esc(x.nickname || '') + Forum.vBadge(x) + '</div>' +
        '<div class="sid" style="font-size:.68rem">' + Forum.esc(x.starId || '') + '</div>' +
      '</div>' +
      (canUnfollow && x.starId ? '<button class="follow-btn sm on" data-sid="' + Forum.esc(x.starId) + '" style="margin-left:auto">已关注</button>' : '') +
      '</div>';
  }
  function bindUnfollow(root) {
    [].forEach.call(root.querySelectorAll('.follow-btn[data-sid]'), function (b) {
      b.onclick = function () {
        Forum.follow(b.getAttribute('data-sid'), 'unfollow').then(function (r) {
          if (r && r.ok) loadPeople(curTab, true);
        });
      };
    });
  }
  var followCache = null;
  function loadPeople(tab, force) {
    peopleEl.style.display = ''; listEl.style.display = 'none';
    if (followCache && !force) { paintPeople(tab); return; }
    peopleEl.innerHTML = '<div class="skel"></div>';
    Forum.followlist().then(function (d) {
      if (!d || !d.ok) { peopleEl.innerHTML = '<div class="empty"><b>加载失败</b>请刷新重试。</div>'; return; }
      followCache = d;
      paintPeople(tab);
    }).catch(function () { peopleEl.innerHTML = '<div class="empty"><b>网络异常</b>请稍后刷新重试。</div>'; });
  }
  function paintPeople(tab) {
    var d = followCache; if (!d) return;
    var btn = tabsEl.querySelector('[data-tab="' + tab + '"]');
    [].forEach.call(tabsEl.querySelectorAll('button'), function (b) { b.textContent = b.textContent.replace(/（\d+）$/, ''); });
    var fb = tabsEl.querySelector('[data-tab="following"]'), wr = tabsEl.querySelector('[data-tab="followers"]');
    fb.textContent = '关注（' + d.following.length + '）';
    wr.textContent = '粉丝（' + d.followers.length + '）';
    var list = tab === 'following' ? d.following : d.followers;
    peopleEl.innerHTML = list.length
      ? list.map(function (x) { return userRow(x, tab === 'following'); }).join('')
      : '<div class="empty"><b>' + (tab === 'following' ? '还没有关注的人' : '还没有人关注你') + '</b>' +
        (tab === 'following' ? '去帖子页点「+ 关注」。' : '多发帖子、多互动，就会有人来关注。') + '</div>';
    bindUnfollow(peopleEl);
  }

  /* ---------- 我的帖子 ---------- */
  function loadPosts() {
    peopleEl.style.display = 'none'; listEl.style.display = '';
    if (!Forum.me()) {
      listEl.innerHTML = '<div class="empty"><b>登录后可以查看自己的帖子</b>用 Star ID、OK 账号或 GitSource 账号登录即可。</div>';
      return;
    }
    var p = new URLSearchParams({ token: Forum.token() });
    Forum.api('/api/forum/mine?' + p.toString()).then(function (d) {
      if (!d || !d.ok) { listEl.innerHTML = '<div class="empty"><b>加载失败</b>' + Forum.esc((d && d.error) || '') + '</div>'; return; }
      var pb = tabsEl.querySelector('[data-tab="posts"]');
      pb.textContent = '我的帖子（' + d.total + '）';
      if (!d.posts.length) {
        listEl.innerHTML = '<div class="empty"><b>还没有发过帖子</b>去论坛看看，或者直接写一篇。<div style="margin-top:16px"><a class="btn btn-primary" href="/new.html">写帖子</a></div></div>';
        return;
      }
      listEl.innerHTML = d.posts.map(card).join('');
    }).catch(function () { listEl.innerHTML = '<div class="empty"><b>网络异常</b>请稍后刷新重试。</div>'; });
  }

  /* ---------- tab 切换 ---------- */
  function switchTab(tab) {
    curTab = tab;
    [].forEach.call(tabsEl.querySelectorAll('button'), function (b) { b.classList.toggle('on', b.getAttribute('data-tab') === tab); });
    if (tab === 'posts') loadPosts(); else loadPeople(tab);
  }
  [].forEach.call(tabsEl.querySelectorAll('button'), function (b) {
    b.addEventListener('click', function () { switchTab(b.getAttribute('data-tab')); });
  });

  function load() {
    renderBanner();
    var u = Forum.me();
    tabsEl.style.display = u ? '' : 'none';
    followCache = null;
    switchTab('posts');
  }

  Forum.init({
    active: 'mine',
    onReady: load,
    onLogin: load
  });
})();
</script>
</body>
</html>
