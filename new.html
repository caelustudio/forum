<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>写帖子 · Caelus 论坛</title>
<link rel="icon" href="/assets/favicon.png" type="image/png">
<link rel="stylesheet" href="https://www.caelus.top/fonts/opposans40/result.css">
<link rel="stylesheet" href="/assets/forum.css?v=20261004g">
<script>(function(){try{var t=localStorage.getItem('theme')||(window.matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light');document.documentElement.setAttribute('data-theme',t);}catch(e){}})();</script>
</head>
<body>
<div class="wrap">
  <div class="main">
    <div class="card editor" id="editor">
      <div class="card-title">写一篇帖子<span class="helper" id="whoami"></span></div>
      <div id="needLogin" hidden>
        <div class="empty" style="padding:26px 10px">
          <b>先登录再发帖</b>
          用 Star ID 或 OK 账号登录后就能发帖了。
          <div style="margin-top:16px"><button class="btn btn-primary" id="goLogin">登录 / 注册</button></div>
        </div>
      </div>
      <div id="form" hidden>
        <div class="ed-field">
          <div class="ed-label">分类</div>
          <div class="cat-picker" id="fCats"></div>
        </div>
        <div class="ed-field">
          <input class="title-in" type="text" id="fTitle" maxlength="80" placeholder="标题：一句话说清这篇帖子在讲什么">
        </div>
        <div class="ed-field">
          <div class="md-bar">
            <div class="md-tabs">
              <button type="button" class="on" id="tabWrite">编辑</button>
              <button type="button" id="tabPreview">预览</button>
            </div>
            <span style="flex:1"></span>
            <div class="md-tools" id="mdTools">
              <button type="button" data-md="bold" title="粗体（Ctrl/⌘ + B）"><b>B</b></button>
              <button type="button" data-md="italic" title="斜体（Ctrl/⌘ + I）"><i>I</i></button>
              <button type="button" data-md="h2" title="标题">H</button>
              <button type="button" data-md="quote" title="引用">❝</button>
              <button type="button" data-md="list" title="无序列表">≡</button>
              <button type="button" data-md="code" title="代码块">&#60;/&#62;</button>
              <button type="button" data-md="link" title="链接（Ctrl/⌘ + K）">🔗</button>
              <button type="button" data-md="image" title="图片">▣</button>
            </div>
          </div>
          <textarea id="fBody" maxlength="8000" placeholder="正文，支持 Markdown：&#10;# 标题　**粗体**　*斜体*　- 列表　> 引用　`代码`&#10;[链接](https://…)　![图片](https://…)"></textarea>
          <div class="md-preview" id="mdPreview" hidden></div>
        </div>
        <div class="ed-field">
          <input type="text" id="fTags" placeholder="话题标签（可选，用空格或逗号分隔，最多 3 个）">
        </div>
        <div class="ed-foot">
          <button class="btn btn-primary" id="publish">发布帖子</button>
          <a class="btn btn-ghost" href="/">取消</a>
          <span class="helper" id="counter"></span>
          <span class="msg" id="msg" style="margin:0"></span>
        </div>
      </div>
    </div>
  </div>

  <aside class="side">
    <div class="card">
      <div class="card-title">发帖提示</div>
      <ul style="margin:0;padding-left:18px;font-size:.78rem;line-height:1.9;color:var(--text-muted)">
        <li>标题尽量具体，方便别人一眼看懂。</li>
        <li>正文支持 Markdown，点「预览」可看最终效果。</li>
        <li>分类决定帖子归到哪个板块，广场顶部可按分类筛选。</li>
        <li>话题标签最多 3 个，会显示在论坛的「话题」里。</li>
        <li>发布后可以随时删除自己的帖子。</li>
        <li>请勿发布侵权、广告或违法违规内容。</li>
      </ul>
    </div>
  </aside>
</div>

<footer class="foot">
  © 2026 Caelus Studio · <a href="https://www.caelus.top/">caelus.top</a>
</footer>

<script src="/assets/forum.js?v=20261004g"></script>
<script>
(function () {
  var msg = Forum.q('#msg'), counter = Forum.q('#counter');

  function showForm() {
    var u = Forum.me();
    if (!u) {
      Forum.q('#needLogin').hidden = false;
      Forum.q('#form').hidden = true;
      return;
    }
    Forum.q('#needLogin').hidden = true;
    Forum.q('#form').hidden = false;
    Forum.q('#whoami').textContent = '以 ' + (u.nickname || 'Star ID 用户') + '（' + (u.starId || '') + '）的身份发布';
    updateCounter();
  }

  function updateCounter() {
    var t = Forum.q('#fTitle').value.length, b = Forum.q('#fBody').value.length;
    counter.textContent = '标题 ' + t + '/80 · 正文 ' + b + '/8000';
  }

  ['#fTitle', '#fBody'].forEach(function (s) {
    Forum.q(s).addEventListener('input', updateCounter);
  });
  Forum.q('#fBody').addEventListener('keydown', function (e) {
    if ((e.ctrlKey || e.metaKey) && e.key === 'Enter') publish();
  });

  /* ---------- Markdown 编辑器：编辑 / 预览 + 工具栏 ---------- */
  var ta = Forum.q('#fBody'), preview = Forum.q('#mdPreview');
  var tabWrite = Forum.q('#tabWrite'), tabPreview = Forum.q('#tabPreview');
  var mode = 'write';

  function setMode(m) {
    mode = m;
    tabWrite.className = m === 'write' ? 'on' : '';
    tabPreview.className = m === 'preview' ? 'on' : '';
    preview.hidden = m !== 'preview';
    ta.hidden = m === 'preview';
    if (m === 'preview') {
      preview.innerHTML = Forum.md(ta.value) || '<p class="md-empty">还没有内容，切回「编辑」写点什么吧。</p>';
    } else {
      ta.focus();
    }
  }
  tabWrite.onclick = function () { setMode('write'); };
  tabPreview.onclick = function () { setMode('preview'); };

  function wrapSel(before, after, ph, block) {
    var v = ta.value;
    var s = ta.selectionStart, e = ta.selectionEnd;
    var picked = v.slice(s, e);
    if (block) { s = e = v.lastIndexOf('\n', s - 1) + 1; picked = ''; }
    if (!picked) picked = ph;
    ta.value = v.slice(0, s) + before + picked + after + v.slice(e);
    ta.focus();
    ta.selectionStart = s + before.length;
    ta.selectionEnd = s + before.length + picked.length;
    updateCounter();
  }
  var MD_ACT = {
    bold: function () { wrapSel('**', '**', '粗体'); },
    italic: function () { wrapSel('*', '*', '斜体'); },
    h2: function () { wrapSel('## ', '', '小标题', true); },
    quote: function () { wrapSel('> ', '', '引用内容', true); },
    list: function () { wrapSel('- ', '', '列表项', true); },
    code: function () { wrapSel('```\n', '\n```', '代码', true); },
    link: function () { wrapSel('[', '](https://)', '链接文字'); },
    image: function () { wrapSel('![', '](https://)', '图片说明'); }
  };
  [].forEach.call(document.querySelectorAll('#mdTools button'), function (b) {
    b.onclick = function () {
      if (mode === 'preview') setMode('write');
      var fn = MD_ACT[b.getAttribute('data-md')];
      if (fn) fn();
    };
  });
  ta.addEventListener('keydown', function (e) {
    if (!(e.ctrlKey || e.metaKey)) return;
    var k = (e.key || '').toLowerCase();
    if (k === 'b') { e.preventDefault(); MD_ACT.bold(); }
    else if (k === 'i') { e.preventDefault(); MD_ACT.italic(); }
    else if (k === 'k') { e.preventDefault(); MD_ACT.link(); }
  });

  Forum.q('#goLogin').onclick = function () { Forum.openLogin(); };

  /* ---------- 分类选择 ---------- */
  var catPick = '讨论';
  function renderCats(cats) {
    var box = Forum.q('#fCats');
    if (!box) return;
    var list = (cats && cats.length) ? cats.map(function (c) { return c.name; }) : ['讨论', '作品', '求助', '公告', '其他'];
    if (list.indexOf(catPick) < 0) catPick = list[0];
    box.innerHTML = list.map(function (n) {
      return '<button type="button" data-cat="' + Forum.esc(n) + '" class="' + (n === catPick ? 'on' : '') + '">' + Forum.esc(n) + '</button>';
    }).join('');
    [].forEach.call(box.querySelectorAll('button'), function (b) {
      b.onclick = function () {
        catPick = b.getAttribute('data-cat');
        [].forEach.call(box.querySelectorAll('button'), function (o) {
          o.className = o === b ? 'on' : '';
        });
      };
    });
  }
  Forum.api('/api/forum/list?size=1').then(function (d) { if (d && d.ok) renderCats(d.cats); })
    .catch(function () { renderCats(null); });

  function publish() {
    var title = Forum.q('#fTitle').value.trim();
    var body = Forum.q('#fBody').value.trim();
    var tags = Forum.q('#fTags').value.trim();
    var category = catPick;
    msg.className = 'msg err';
    if (title.length < 2) { msg.textContent = '标题太短了，至少写 2 个字'; return; }
    if (!body) { msg.textContent = '正文不能为空'; return; }
    var btn = Forum.q('#publish');
    btn.disabled = true; btn.textContent = '发布中…';
    Forum.api('/api/forum/create', Forum.authBody({ title: title, body: body, tags: tags, category: category })).then(function (d) {
      btn.disabled = false; btn.textContent = '发布帖子';
      if (!d || !d.ok) { msg.textContent = (d && d.error) || '发布失败，请稍后重试'; return; }
      location.href = '/post.html?id=' + encodeURIComponent(d.post.id);
    }).catch(function () {
      btn.disabled = false; btn.textContent = '发布帖子';
      msg.textContent = '网络异常，请稍后重试';
    });
  }
  Forum.q('#publish').onclick = publish;

  Forum.init({
    active: 'new',
    onReady: function () {
      showForm();
      var p = new URLSearchParams(location.search);
      if (p.get('title')) { Forum.q('#fTitle').value = p.get('title'); updateCounter(); }
      if (Forum.me()) Forum.q('#fTitle').focus();
    },
    onLogin: showForm
  });
})();
</script>
</body>
</html>
